<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【ポイント講義】交換・整列・探索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&display=swap">
<style>
/* Layout: 上にタブ、左に「配列の舞台（アニメーション）」、右に「共通テスト表記のプログラム」。狭い画面では縦に積む */
:root{
  --bg:#edf0f4; --panel:#ffffff; --panel2:#f5f7fa; --ink:#1b2230; --muted:#596273; --line:#d2d8e1;
  --accent:#2547a6; --accent-soft:#e1e7f8;
  --cmp:#c96a00; --cmp-soft:#fde8c8;
  --ok:#1d7f53; --ok-soft:#d6efe2;
  --hold:#6d3fd0; --hold-soft:#ebe3fb;
  --bad:#b8321f; --bad-soft:#f9e0db;
  --cur:#fff3bf; --curline:#e3b52b;
  --p-i:#2547a6; --p-j:#c96a00; --p-s:#b8321f; --p-c:#6d3fd0; --p-lo:#0e7c7b;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
  --f-ui:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-code:"BIZ UDGothic","Osaka-Mono","MS Gothic",ui-monospace,monospace;
  --f-title:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141b; --panel:#181e28; --panel2:#1e2531; --ink:#e5e9f0; --muted:#9aa3b3; --line:#2d3644;
    --accent:#8ea7ff; --accent-soft:#232e4b; --cmp:#f3a43a; --cmp-soft:#3b2b12; --ok:#4cc38a; --ok-soft:#163427;
    --hold:#b597ff; --hold-soft:#2a2242; --bad:#ff8a73; --bad-soft:#3d1f1a; --cur:#37311a; --curline:#d4a933;
    --p-i:#8ea7ff; --p-j:#f3a43a; --p-s:#ff8a73; --p-c:#b597ff; --p-lo:#45c7c4;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141b; --panel:#181e28; --panel2:#1e2531; --ink:#e5e9f0; --muted:#9aa3b3; --line:#2d3644;
  --accent:#8ea7ff; --accent-soft:#232e4b; --cmp:#f3a43a; --cmp-soft:#3b2b12; --ok:#4cc38a; --ok-soft:#163427;
  --hold:#b597ff; --hold-soft:#2a2242; --bad:#ff8a73; --bad-soft:#3d1f1a; --cur:#37311a; --curline:#d4a933;
  --p-i:#8ea7ff; --p-j:#f3a43a; --p-s:#ff8a73; --p-c:#b597ff; --p-lo:#45c7c4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;margin-bottom:12px}
header.top h1{font-family:var(--f-title);font-weight:700;font-size:1.55rem;margin:0;letter-spacing:.02em;text-wrap:balance}
header.top .sub{color:var(--muted);font-size:.86rem}
nav.tabs{display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:14px}
.tgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tgroup .gl{font-size:.75rem;color:var(--muted);letter-spacing:.08em;margin-right:2px}
.tab{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--curline);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:.9rem}
.ph .tag{font-weight:400;color:var(--muted);font-size:.78rem}
.fold{font:inherit;font-weight:700;color:var(--ink);background:none;border:none;padding:2px 6px 2px 0;margin:-2px 0;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border-radius:6px}
.fold:hover{color:var(--accent)}
.fold .chev{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s;margin:0 2px 3px 2px}
.fold[aria-expanded="false"] .chev{transform:rotate(-45deg);margin-bottom:0}
.panel.folded > .ph{border-bottom:none}
.pb{padding:12px 14px}
/* ---- stage ---- */
.stagebox{padding:6px 10px 4px;overflow:hidden}
#stage{position:relative;width:100%;user-select:none}
.card{position:absolute;border:2px solid var(--line);background:var(--panel);border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--f-code);font-weight:700;transition:border-color .2s,background-color .2s,opacity .25s,box-shadow .2s;font-variant-numeric:tabular-nums}
.card .lvl{position:absolute;left:0;right:0;bottom:0;background:var(--accent-soft);transition:height .25s}
.card .val{position:relative;z-index:1}
.card.done{border-color:var(--ok)}
.card.done .lvl{background:var(--ok-soft)}
.card.dim{opacity:.28}
.card.cmp{border-color:var(--cmp);box-shadow:0 0 0 4px var(--cmp-soft)}
.card.stale .val{opacity:.3}
.card.stale .lvl{opacity:.35}
.card.stale{border-style:dashed}
.card.found{border-color:var(--ok);box-shadow:0 0 0 5px var(--ok-soft);background:var(--ok-soft)}
.card.src{border-style:dashed}
.card.land{animation:land .55s ease-out}
@keyframes land{0%{box-shadow:0 0 0 8px var(--curline)}100%{box-shadow:0 0 0 0 transparent}}
.card.tmp{border-color:var(--hold);border-width:2.5px}
.card.tmp .lvl{background:var(--hold-soft)}
.card.tmp.empty .val{color:var(--muted);font-weight:400}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--accent)}
.card.ghost{z-index:20;border-color:var(--curline);box-shadow:0 8px 20px rgba(0,0,0,.25);pointer-events:none;transition:none}
.tmplabel{position:absolute;font-family:var(--f-code);font-weight:700;color:var(--hold);font-size:.85rem;text-align:center}
.idx{position:absolute;text-align:center;font-family:var(--f-code);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.idx.named{font-size:1rem;font-weight:700;color:var(--ink)}
.br{position:absolute;height:18px;border:2px solid var(--muted);border-bottom:none;border-radius:6px 6px 0 0;transition:left .3s,width .3s,opacity .3s}
.br span{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--panel);padding:0 6px;font-size:.74rem;color:var(--muted);white-space:nowrap}
.br.k-done{border-color:var(--ok)} .br.k-done span{color:var(--ok)}
.ptr{position:absolute;height:24px;padding:0 7px;border-radius:6px;color:var(--panel);font-family:var(--f-code);font-weight:700;font-size:.8rem;line-height:24px;white-space:nowrap;transition:left .3s ease,opacity .25s;transform:translateX(-50%)}
.ptr::before{content:"";position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:6px solid transparent;border-top:none;border-bottom-color:inherit;border-bottom-width:6px}
.ptr.off{opacity:0}
.banner{margin:2px 10px 12px;padding:9px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:.95rem;min-height:2.6em;overflow-wrap:anywhere;box-sizing:border-box}
.banner b{color:var(--accent);margin-right:.4em;font-family:var(--f-code)}
.res-t{color:var(--ok);font-weight:700} .res-f{color:var(--bad);font-weight:700}
/* controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:disabled{opacity:.45;cursor:default}
.speed{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.scrub{flex:1 1 180px;display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.scrub input{flex:1;min-width:80px}
.counters{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px}
.cnt{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--panel2)}
.cnt .k{font-size:.78rem;color:var(--muted)} .cnt .v{font-family:var(--f-code);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.orow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.orow > label.l{font-size:.8rem;color:var(--muted);min-width:5.5em}
.orow input[type=text],.orow input[type=number],.orow select{font:inherit;font-family:var(--f-code);padding:5px 8px;border:1.5px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);min-width:0}
.orow input[type=text]{flex:1 1 200px}
.orow input[type=number]{width:6em}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:none;background:var(--panel);color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.err{color:var(--bad);font-size:.82rem;min-height:1.2em}
.note{font-size:.8rem;color:var(--muted)}
/* code */
.code{font-family:var(--f-code);font-size:.93rem;line-height:1.75;padding:8px 0;overflow-x:auto}
.ln{display:flex;align-items:stretch;padding-right:12px;position:relative;min-width:max-content}
.ln .no{flex:0 0 2.6em;text-align:right;padding-right:.8em;color:var(--muted);font-size:.8rem;user-select:none;font-variant-numeric:tabular-nums;align-self:center}
.ln .gs{display:flex;flex:0 0 auto}
.g{width:1.5em;position:relative}
.g::before{content:"";position:absolute;left:.35em;top:0;bottom:0;border-left:1.6px solid var(--muted)}
.g.e::before{bottom:.28em}
.g.e::after{content:"";position:absolute;left:.35em;bottom:.28em;width:.8em;border-top:1.6px solid var(--muted)}
.ln .tx{white-space:pre;padding-left:.15em}
.ln.cur{background:var(--cur)}
.ln.cur::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--curline)}
.ln.prev{background:linear-gradient(90deg,var(--panel2),transparent)}
.kw{color:var(--accent);font-weight:700}
.cm{color:var(--muted)}
.blank{display:inline-block;min-width:2.2em;text-align:center;border:1.5px solid var(--ink);padding:0 .3em;line-height:1.35;margin:0 .1em;font-family:var(--f-ui);font-weight:700}
.strike .tx{text-decoration:line-through;color:var(--bad)}
.miss{font-family:var(--f-ui);font-size:.75rem;color:var(--bad);margin-left:.6em;text-decoration:none;display:inline-block}
.badge{margin-left:10px;font-family:var(--f-ui);font-size:.78rem;font-weight:700;padding:0 8px;border-radius:999px;align-self:center;line-height:1.7;white-space:nowrap}
.badge.t{background:var(--ok-soft);color:var(--ok)} .badge.f{background:var(--bad-soft);color:var(--bad)} .badge.n{background:var(--accent-soft);color:var(--accent)}
/* vars */
.vars{display:flex;flex-wrap:wrap;gap:8px}
.var{display:flex;align-items:baseline;gap:8px;border:1.5px solid var(--line);border-radius:8px;padding:3px 10px;font-family:var(--f-code)}
.var .k{color:var(--muted);font-size:.85rem}
.var .v{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.var.chg{animation:chg .8s ease-out}
@keyframes chg{0%{background:var(--cur);border-color:var(--curline)}100%{background:transparent}}
.out{font-family:var(--f-code);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:2.2em;white-space:pre-wrap;overflow-wrap:anywhere}
.out .warn{color:var(--bad);font-family:var(--f-ui);font-weight:700}
/* log */
.fcbox{padding:10px 8px;text-align:center}
#fc{max-width:100%;height:auto;display:inline-block}
#fc text{font-family:var(--f-code);font-size:12.5px;fill:var(--ink)}
#fc .fc-n{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
#fc .fc-g.cur .fc-n{fill:var(--cur);stroke:var(--curline);stroke-width:3}
#fc .fc-l{stroke:var(--muted);stroke-width:1.5;fill:none}
#fc .fc-ah{fill:var(--muted)}
#fc .fc-lab{font-family:var(--f-ui);font-size:11px;fill:var(--muted)}
#fc .fc-g.miss .fc-n{stroke:var(--bad);stroke-dasharray:4 3}
#fc .fc-g.miss text{fill:var(--bad)}
#fc .fc-badge text{font-family:var(--f-ui);font-size:11.5px;font-weight:700}
#fc .fc-badge.t rect{fill:var(--ok-soft)} #fc .fc-badge.t text{fill:var(--ok)}
#fc .fc-badge.f rect{fill:var(--bad-soft)} #fc .fc-badge.f text{fill:var(--bad)}
#fc .fc-badge.n rect{fill:var(--accent-soft)} #fc .fc-badge.n text{fill:var(--accent)}
.log{max-height:240px;overflow:auto;margin:0;padding:6px 0;list-style:none;font-size:.86rem}
.log li{display:flex;gap:10px;padding:2px 14px;overflow-wrap:anywhere}
.log li .l{flex:0 0 3.2em;color:var(--muted);font-family:var(--f-code);font-size:.78rem;padding-top:.15em}
.log li.now{background:var(--cur)}
/* points */
.points{margin:0;padding:0 14px 12px 14px;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.points li{padding-left:1.1em;text-indent:-1.1em}
.points li::before{content:"・"}
.points li.try::before{content:"？"; color:var(--accent);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.76rem;color:var(--muted);padding:0 12px 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;border:2px solid var(--line);display:inline-block}
@media (prefers-reduced-motion: reduce){ .card,.ptr,.br{transition:none} .card.land,.var.chg{animation:none} }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>【ポイント講義】交換・整列・探索</h1>
      <div class="sub">情報Ⅰ演習｜共通テスト用プログラム表記と1行ずつ同期して動きます</div>
    </div>
    <div class="sub">→ キーで1行進む／← で戻る／Space で自動再生</div>
  </header>

  <nav class="tabs" id="tabs" aria-label="アルゴリズムの選択"></nav>

  <div class="grid">
    <div class="col">
      <section class="panel">
        <div class="ph"><span id="stageTitle">配列のようす</span><span class="tag" id="stageTag"></span></div>
        <div class="stagebox"><div id="stage"></div></div>
        <div class="legend" id="legend"></div>
        <div class="banner" id="banner"></div>
        <div class="counters" id="counters"></div>
        <div class="controls">
          <button class="btn" id="bReset" title="最初に戻る">⏮ 最初</button>
          <button class="btn" id="bBack" title="1行戻る（←）">◀ 戻る</button>
          <button class="btn primary" id="bStep" title="1行進む（→）">1行進む ▶</button>
          <button class="btn" id="bPlay" title="自動再生（Space）">▶ 自動再生</button>
          <button class="btn" id="bEnd" title="最後まで">⏭ 最後</button>
          <label class="speed" for="speed">速さ <input type="range" id="speed" min="1" max="5" value="3"></label>
          <div class="scrub"><input type="range" id="scrub" min="0" max="1" value="0" aria-label="ステップ位置"><span id="stepNo">0 / 0</span></div>
        </div>
      </section>

      <section class="panel">
        <div class="ph"><span>データと設定</span><span class="tag">値を変えて試そう</span></div>
        <div class="pb opts" id="opts"></div>
      </section>

    </div>

    <div class="col">
      <section class="panel">
        <div class="ph"><button type="button" class="fold" id="foldCode" aria-expanded="true" aria-controls="code"><span class="chev" aria-hidden="true"></span>プログラム</button><span class="tag">共通テスト用プログラム表記</span></div>
        <div class="code" id="code"></div>
      </section>
      <section class="panel">
        <div class="ph"><button type="button" class="fold" id="foldFc" aria-expanded="true" aria-controls="fcbox"><span class="chev" aria-hidden="true"></span>フローチャート</button><span class="tag">黄色＝今実行した処理（プログラムと同じ行）</span></div>
        <div class="fcbox" id="fcbox"><svg id="fc" role="img" aria-label="フローチャート"></svg></div>
      </section>
      <section class="panel">
        <div class="ph"><span>変数</span><span class="tag">黄色く光る＝今の行で値が変わった</span></div>
        <div class="pb vars" id="vars"></div>
      </section>
      <section class="panel">
        <div class="ph"><span>実行結果（表示する）</span></div>
        <div class="pb"><div class="out" id="out"></div></div>
      </section>
      <section class="panel">
        <div class="ph"><span>実行の記録（トレース）</span><span class="tag">何行目で何が起きたか</span></div>
        <ol class="log" id="log"></ol>
      </section>
    </div>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- テキスト整形 ---------------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const KW=['ずつ増やしながら繰り返す:','ずつ減らしながら繰り返す:','の間繰り返す:','そうでなくもし','そうでなければ:','プログラムを終了する','反復を抜ける','ならば:','もし','表示する','要素数',' を ',' から ',' まで ',' and ',' or '];
const KWRE=new RegExp(KW.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
function tok(html,blank){
  html=html.replace(/\{\?([^{}]*)\}/g,(m,a)=>blank?'':a);
  html=html.replace(/\{([ア-ン]):([^{}]+)\}/g,(m,l,a)=>blank?`<span class="blank">${l}</span>`:a);
  return html;
}
function fmtLog(s,blank){
  let h=tok(esc(s),blank);
  h=h.replace(/→　真/g,'→　<span class="res-t">真</span>').replace(/→　偽/g,'→　<span class="res-f">偽</span>');
  return h;
}
function codeLine(raw,blank){
  const m=raw.match(/^([│⎿]*)(.*)$/); const marks=[...m[1]]; let text=m[2]; let strike=false;
  if(text.startsWith('~')){strike=true;text=text.slice(1);}
  const ci=text.indexOf('#'); const code=ci>=0?text.slice(0,ci):text; const cm=ci>=0?text.slice(ci):'';
  let h=tok(esc(code).replace(KWRE,'<span class="kw">$&</span>'),blank);
  if(cm) h+=`<span class="cm">${esc(cm)}</span>`;
  return {guides:marks.map(c=>`<span class="g${c==='⎿'?' e':''}"></span>`).join(''),html:h,strike};
}

/* ---------------- トレーサ（1行実行するごとに状態を記録） ---------------- */
class Tracer{
  constructor(arr,tmpName){this.a=arr.slice();this.t=null;this.tn=tmpName;this.v={};this.p={};this.reg={};this.cnt={cmp:0,a:0};this.out=[];this.steps=[];this.sync=null;}
  s(line,log,x={}){
    if(this.sync)this.sync();
    this.steps.push({line,log,arr:this.a.slice(),t:this.t,v:{...this.v},p:{...this.p},reg:JSON.parse(JSON.stringify(this.reg)),cnt:{...this.cnt},out:this.out.slice(),act:x.act||null,badge:x.badge||null,end:!!x.end});

// 部品：P=処理、T=端子（開始・終了）、L=繰り返し（初期化・条件の判断・更新）、IF=判断、BR=反復を抜ける
const fP=(t,ln,o={})=>({k:'p',t,ln,...o});
const fT=(t,ln)=>({k:'t',t,ln});
const fL=(init,cond,upd,ln,body)=>({k:'loop',init,cond,upd,ln,body});
const fIF=(c,ln,then,els,o={})=>({k:'if',c,ln,then,els,...o});
const fBR=(t,ln)=>({k:'br',t,ln});
const FLOWS={
  swap(o){const[x,y]=o.xy;return o.variant==='ok'
    ?[fT('開始',0),fP(`x = ${x}`,1),fP(`y = ${y}`,2),fP('koukan = x',3),fP('x = y',4),fP('y = koukan',5),fP('表示する(x, y)',6),fT('終了')]
    :[fT('開始',0),fP(`x = ${x}`,1),fP(`y = ${y}`,2),fP('x = y',3),fP('y = x',4),fP('表示する(x, y)',5),fT('終了')];},
  selection(o){const op=o.order==='asc'?'<':'>';return[fT('開始',0),fP('Hairetsu = 【入力】',2),fP('n = 要素数(Hairetsu)',3),
    fL('i = 0','i <= n - 2','i = i + 1',5,[
      fP('saisyou = i',6),
      fL('j = i + 1','j <= n - 1','j = j + 1',7,[
        fIF(`Hairetsu[{ア:j}] ${op} Hairetsu[{イ:saisyou}]`,8,[fP('{ウ:saisyou} = {エ:j}',9)])]),
      fP('koukan = Hairetsu[i]',10),fP('Hairetsu[i] = Hairetsu[saisyou]',11),fP('Hairetsu[saisyou] = koukan',12)]),
    fP('表示する(Hairetsu)',14),fT('終了')];},
  insertion(o){const op=o.order==='desc'?'<':'>';return[fT('開始',0),fP('Hairetsu = 【入力】',2),fP('n = 要素数(Hairetsu)',3),
    fL('i = 1','i <= {ア:n - 1}','i = i + 1',5,[
      fP('hozon = Hairetsu[i]',6),fP('j = {イ:i - 1}',7),
      fL(null,`j >= 0 and Hairetsu[{ウ:j}] ${op} hozon`,null,8,[
        fP('Hairetsu[{エ:j + 1}] = Hairetsu[{オ:j}]',9),fP('j = j - 1',10)]),
      fP('Hairetsu[{カ:j + 1}] = hozon',11)]),
    fP('表示する(Hairetsu)',13),fT('終了')];},
  bubble(o){const op=o.order==='asc'?'>':'<';const v=o.variant;
    const head=[fT('開始',0),fP('Suretsu = 【入力】',2),fP('n = 要素数(Suretsu)',3)];
    if(v==='basic')return[...head,
      fL('i = n - 2','i >= 0','i = i - 1',5,[
        fL('j = 0','j <= i','j = j + 1',6,[
          fIF(`Suretsu[j] ${op} Suretsu[j + 1]`,7,[fP('koukan = Suretsu[j]',8),fP('Suretsu[j] = Suretsu[j + 1]',9),fP('Suretsu[j + 1] = koukan',10)])])]),
      fP('表示する(Suretsu)',12),fT('終了')];
    return[...head,
      fL('i = n - 2','i >= 0','i = i - 1',5,[
        fP('f = 0',6),
        fL('j = 0','j <= i','j = j + 1',7,[
          fIF(`Suretsu[j] ${op} Suretsu[j + 1]`,8,[fP('koukan = Suretsu[j]',9),fP('Suretsu[j] = Suretsu[j + 1]',10),fP('Suretsu[j + 1] = koukan',11),fP('f = 1',12,{miss:v==='noC'})])]),
        fIF('f == 0',13,[fBR('反復を抜ける',14)])]),
      fP('表示する(Suretsu)',16),fT('終了')];},
  linear(){return[fT('開始',0),fP('Hairetsu = 【入力】',2),fP('atai = 【入力】',3),fP('n = 要素数(Hairetsu)',4),
    fL('i = 0','i <= n - 1','i = i + 1',6,[
      fIF('Hairetsu[i] == atai',7,[fP('表示する(i)',8),fT('終了',9)])]),
    fP('表示する("見つかりませんでした")',10),fT('終了')];},
  binary(){return[fT('開始',0),fP('Hairetsu = 【入力】',2),fP('atai = 【入力】',3),fP('n = 要素数(Hairetsu)',4),fP('sentou = 0',6),fP('matsubi = n - 1',7),
    fL(null,'sentou <= matsubi',null,9,[
      fP('chuou = (sentou + matsubi) ÷ 2',10),
      fIF('{ア:atai} == Hairetsu[chuou]',11,[fP('表示する({イ:chuou})',13),fT('終了',14)],
        [fIF('{ア:atai} < Hairetsu[chuou]',15,[fP('{ウ:matsubi} = {イ:chuou} - 1',16)],[fP('{エ:sentou} = {イ:chuou} + 1',18)],{ln2:17})])]),
    fT('終了')];},
};
const FC={FS:12.5,NH:30,G:18,DH:46};
const NS='http://www.w3.org/2000/svg';
let fcNodes=[];
function fcText(t,blank){return t.replace(/\{\?([^{}]*)\}/g,(m,a)=>blank?'':a).replace(/\{([ア-ン]):([^{}]+)\}/g,(m,l,a)=>blank?`［${l}］`:a);}
let fcCtx=null;
function fcW(t){ // 実際の表示フォントで文字幅を測る（測れないときは概算）
  try{if(!fcCtx){fcCtx=document.createElement('canvas').getContext('2d');}
    const ff=getComputedStyle(document.documentElement).getPropertyValue('--f-code')||'monospace';
    fcCtx.font=`${FC.FS}px ${ff}`;const w=fcCtx.measureText(t).width;if(w>0)return w;}catch(e){}
  let w=0;for(const ch of t)w+=(ch.charCodeAt(0)<0x2000?0.6:1)*FC.FS;return w;}
function svgEl(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function linesOf(seq){const s=new Set();const walk=a=>a.forEach(n=>{if(n.ln!==undefined)s.add(n.ln);if(n.ln2)s.add(n.ln2);if(n.body)walk(n.body);if(n.then)walk(n.then);if(n.els)walk(n.els);});walk(seq);return s;}
function fcLayout(seq,blank){
  // 各ブロックは {h,l,r,exit,draw(cx,y,ctx)}：中心線から左右の幅 l・r、上端から下へ描く
  const node=(n)=>{
    const t=fcText(n.t,blank);
    const w=Math.max(n.k==='t'?84:110,fcW(t+(n.miss?'（書き忘れ）':''))+30);
    return{w,h:FC.NH,l:w/2,r:w/2,exit:!(n.k==='t'&&n.t!=='開始')&&n.k!=='br',draw(cx,y,ctx){
      const g=svgEl('g',{class:'fc-g'+(n.miss?' miss':'')},ctx.svg);
      svgEl('rect',{x:cx-w/2,y,width:w,height:FC.NH,rx:n.k==='t'?FC.NH/2:2,class:'fc-n'},g);
      const tx=svgEl('text',{x:cx,y:y+FC.NH/2+1,'text-anchor':'middle','dominant-baseline':'central'},g);tx.textContent=t+(n.miss?'（書き忘れ）':'');
      if(n.ln!==undefined)fcNodes.push({ln:n.ln,g,x:cx+w/2,y,kind:n.k,role:n.role,loop:n.loop});
      if(n.k==='br'&&ctx.breaks.length)ctx.breaks[ctx.breaks.length-1].push({x:cx+w/2,y:y+FC.NH/2});
    }};
  };
  const DH=FC.DH;
  const block=(n)=>{
    if(n.k==='p'||n.k==='t'||n.k==='br')return node(n);
    if(n.k==='loop'){
      // 繰り返しを「初期化 → 条件の判断 → 本体 → 更新 → 判断へ戻る」の形で描く
      n._lines=linesOf(n.body);
      const ini=n.init?node({k:'p',t:n.init,ln:n.ln,role:'init',loop:n}):null;
      const upd=n.upd?node({k:'p',t:n.upd,ln:n.ln,role:'upd',loop:n}):null;
      const c=fcText(n.cond,blank),dw=Math.max(126,fcW(c)*1.16+32),body=seqL(n.body);
      const inL=Math.max(dw/2,body.l,ini?ini.l:0,upd?upd.l:0),inR=Math.max(dw/2,body.r,ini?ini.r:0,upd?upd.r:0);
      const yD=ini?FC.NH+FC.G:0,yB=yD+DH+FC.G,yU=yB+body.h+FC.G,yE=upd?yU+FC.NH:yB+body.h,yBack=yE+12,h=yBack+16;
      return{h,l:inL+20,r:inR+20,exit:true,draw(cx,y,ctx){
        if(ini){ini.draw(cx,y,ctx);arrow(ctx,[[cx,y+FC.NH],[cx,y+yD]]);}
        diamond(ctx,cx,y+yD,dw,c,{ln:n.ln,role:'cond',loop:n});
        arrow(ctx,[[cx,y+yD+DH],[cx,y+yB]]);label(ctx,cx+6,y+yD+DH+9,'Yes');
        ctx.breaks.push([]);
        body.draw(cx,y+yB,ctx);
        const br=ctx.breaks.pop();
        if(upd){if(body.exit)arrow(ctx,[[cx,y+yB+body.h],[cx,y+yU]]);upd.draw(cx,y+yU,ctx);}
        const xb=cx-inL-12,xr=cx+inR+12,yc=y+yD+DH/2;
        if(upd||body.exit)arrow(ctx,[[cx,y+yE],[cx,y+yBack],[xb,y+yBack],[xb,yc],[cx-dw/2-1,yc]]);
        arrow(ctx,[[cx+dw/2,yc],[xr,yc],[xr,y+h],[cx+2,y+h]]);label(ctx,cx+dw/2+4,yc-9,'No');
        br.forEach(b=>arrow(ctx,[[b.x,b.y],[xr-1,b.y]]));
      }};
    }
    if(n.k==='if'){
      const c=fcText(n.c,blank),dw=Math.max(126,fcW(c)*1.16+32);
      if(!n.els&&n.then.length===1&&n.then[0].k==='br'){
        // 「もし ～ ならば 反復を抜ける」：Yes を右へ出し、繰り返しの出口へつなぐ
        const b=node(n.then[0]);
        return{h:DH,l:dw/2,r:dw/2+24+b.w,exit:true,draw(cx,y,ctx){
          diamond(ctx,cx,y,dw,c,n);
          const bx=cx+dw/2+24;
          arrow(ctx,[[cx+dw/2,y+DH/2],[bx,y+DH/2]]);label(ctx,cx+dw/2+4,y+DH/2-9,'Yes');
          b.draw(bx+b.w/2,y+DH/2-FC.NH/2,ctx);
          label(ctx,cx+6,y+DH+9,'No');
        }};
      }
      const th=seqL(n.then);
      if(!n.els){
        const bx=Math.max(dw/2,th.r)+16;
        const h=DH+FC.G+th.h+14;
        return{h,l:Math.max(dw/2,th.l),r:bx+4,exit:true,draw(cx,y,ctx){
          diamond(ctx,cx,y,dw,c,n);
          arrow(ctx,[[cx,y+DH],[cx,y+DH+FC.G]]);label(ctx,cx+6,y+DH+9,'Yes');
          th.draw(cx,y+DH+FC.G,ctx);
          const my=y+h;
          if(th.exit)line(ctx,[[cx,y+DH+FC.G+th.h],[cx,my]]);
          arrow(ctx,[[cx+dw/2,y+DH/2],[cx+bx,y+DH/2],[cx+bx,my],[cx+2,my]]);label(ctx,cx+dw/2+4,y+DH/2-9,'No');
        }};
      }
      const el=seqL(n.els);
      const off=Math.max(dw/2+10,th.r+18+el.l);
      const h=DH+FC.G+Math.max(th.h,el.h)+14;
      return{h,l:Math.max(dw/2,th.l),r:off+el.r,exit:th.exit||el.exit,draw(cx,y,ctx){
        diamond(ctx,cx,y,dw,c,n);
        arrow(ctx,[[cx,y+DH],[cx,y+DH+FC.G]]);label(ctx,cx+6,y+DH+9,'Yes');
        th.draw(cx,y+DH+FC.G,ctx);
        const xe=cx+off,my=y+h;
        arrow(ctx,[[cx+dw/2,y+DH/2],[xe,y+DH/2],[xe,y+DH+FC.G]]);label(ctx,cx+dw/2+4,y+DH/2-9,'No');
        el.draw(xe,y+DH+FC.G,ctx);
        if(th.exit)line(ctx,[[cx,y+DH+FC.G+th.h],[cx,my]]);
        if(el.exit)arrow(ctx,[[xe,y+DH+FC.G+el.h],[xe,my],[cx+2,my]]);
      }};
    }
  };
  const seqL=(s)=>{
    const bs=s.map(block);let h=0;bs.forEach((b,i)=>h+=b.h+(i?FC.G:0));
    return{h,l:Math.max(0,...bs.map(b=>b.l)),r:Math.max(0,...bs.map(b=>b.r)),exit:bs.length?bs[bs.length-1].exit:true,draw(cx,y,ctx){
      let yy=y;bs.forEach((b,i)=>{if(i){if(bs[i-1].exit)arrow(ctx,[[cx,yy],[cx,yy+FC.G]]);yy+=FC.G;}b.draw(cx,yy,ctx);yy+=b.h;});

function updFlow(st,k){

  fcNodes.forEach(n=>n.g.classList.remove('cur'));
  const bl=$('#fcBadge');if(bl)while(bl.firstChild)bl.removeChild(bl.firstChild);

  const lp=hits.find(n=>n.loop);
  if(lp){
    const prev=k>0?S.steps[k-1].line:0;
    const back=lp.loop._lines&&lp.loop._lines.has(prev);
    hits=hits.filter(n=>n.role==='cond'||(back?n.role==='upd':n.role==='init'));
  }
  hits.forEach(n=>n.g.classList.add('cur'));

  $('#stepNo').textContent=`${k} / ${N}`;const sc=$('#scrub');sc.max=N;sc.value=k;
  $('#bBack').disabled=k===0;$('#bReset').disabled=k===0;$('#bStep').disabled=k===N;$('#bEnd').disabled=k===N;
  $('#bPlay').textContent=S.playing?'⏸ 一時停止':(k===N?'↺ もう一度':'▶ 自動再生');
}

/* ---------------- 再生 ---------------- */
async function render(k,animate){
  finishAnim();
  const st=S.steps[k],pv=k>0?S.steps[k-1]:st;
  updCode(st,pv);updFlow(st,k);updVars(st,pv,animate);updLog(k);updBanner(st,k);updCounters(st);updOut(st);updCtl();
  const act=st.act;
  if(animate&&act&&act.type==='copy'&&!reduced){
    paint(st,pv);
    const src=act.from==='t'?tmpCard:cards[act.from];if(src)src.classList.add('src');
    const val=act.from==='t'?pv.t:pv.arr[act.from];
    await fly(act.from,act.to,val,S.dur);
    if(S.k!==k)return;
    paint(st);flash(act.to);
  }else{
    paint(st);
    if(animate&&act&&(act.type==='copy'||act.type==='set'))flash(act.to);
  }
}
function rebuild(){
  stop();
  const A=S.algo;
  S.steps=A.trace(S.opts);S.k=0;
  $('#stageTitle').textContent=A.arrName?`配列 ${A.arrName} のようす`:'変数のようす';
  $('#stageTag').textContent=A.title;
  buildCode();buildStage();updLegend();render(0,false);fitBanner();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function play(){
  if(S.k>=S.steps.length-1){S.k=0;render(0,false);await sleep(300);}
  S.playing=true;const id=++S.playId;updCtl();
  while(S.playing&&id===S.playId&&S.k<S.steps.length-1){
    S.k++;await render(S.k,true);
    if(!S.playing||id!==S.playId)break;
    await sleep(S.delay);
  }
  if(id===S.playId){S.playing=false;updCtl();}
}
function stop(){S.playing=false;S.playId++;if(S.steps.length)updCtl();}
function step(d){stop();const k=Math.max(0,Math.min(S.steps.length-1,S.k+d));if(k===S.k)return;S.k=k;render(k,d>0);}
function setSpeed(v){const[d,w]=SPEED[v-1];S.dur=d;S.delay=w;}

// 欄の折りたたみ（初期状態はどちらも開く）
function setupFold(btnId,bodyId){
  const btn=document.getElementById(btnId),body=document.getElementById(bodyId),panel=btn.closest('.panel');
  btn.onclick=()=>{const open=btn.getAttribute('aria-expanded')!=='true';
    btn.setAttribute('aria-expanded',open?'true':'false');body.hidden=!open;panel.classList.toggle('folded',!open);
    if(open&&bodyId==='fcbox'&&S.steps.length)updFlow(S.steps[S.k],S.k);};
}
setupFold('foldCode','code');setupFold('foldFc','fcbox');
$('#bStep').onclick=()=>step(1);
$('#bBack').onclick=()=>step(-1);
$('#bReset').onclick=()=>{stop();S.k=0;render(0,false);};
$('#bEnd').onclick=()=>{stop();S.k=S.steps.length-1;render(S.k,false);};
$('#bPlay').onclick=()=>{if(S.playing)stop();else play();};
$('#speed').oninput=e=>setSpeed(+e.target.value);
$('#scrub').oninput=e=>{stop();S.k=+e.target.value;render(S.k,false);};
document.addEventListener('keydown',e=>{
  const t=e.target;if(t&&((t.tagName==='INPUT'&&!['checkbox','range'].includes(t.type))||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;
  if(t&&t.type==='range'&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))return;
  if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  else if(e.key===' '&&!(t&&t.tagName==='BUTTON')){e.preventDefault();S.playing?stop():play();}
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!S.steps.length)return;finishAnim();buildStage();render(S.k,false);fitBanner();},120);});

/* ---------------- 起動 ---------------- */
setSpeed(3);buildTabs();
try{document.fonts&&document.fonts.ready.then(()=>{if(S.steps.length){buildFlow();updFlow(S.steps[S.k],S.k);}});}catch(e){}
let first='selection';
const h=(location.hash||'').slice(1);
if(ALGOS.some(a=>a.id===h))first=h;
else{try{const s=localStorage.getItem('algoLabTab');if(s&&ALGOS.some(a=>a.id===s))first=s;}catch(e){}}
selectAlgo(first);
</script>
